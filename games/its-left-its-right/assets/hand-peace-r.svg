<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right hand peace sign -->
  <g transform="translate(100,115)">
    <ellipse cx="0" cy="40" rx="28" ry="20" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-28" y="30" width="56" height="14" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-10" cy="37" r="3" fill="#3D4852"/>
    <circle cx="10" cy="37" r="3" fill="#3D4852"/>
    <ellipse cx="0" cy="8" rx="24" ry="22" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Curled fingers -->
    <path d="M-16,0 Q-22,-6 -18,-12 Q-14,-6 -10,2" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <path d="M16,0 Q22,-6 18,-12 Q14,-6 10,2" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <!-- V fingers -->
    <rect x="-12" y="-48" width="10" height="52" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5" transform="rotate(-8,-7,-22)"/>
    <rect x="2" y="-48" width="10" height="52" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5" transform="rotate(8,7,-22)"/>
    <!-- Thumb across -->
    <rect x="-22" y="0" width="12" height="22" rx="6" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(20,-16,10)"/>
  </g>
</svg>