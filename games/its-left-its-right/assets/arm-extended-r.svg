<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right arm extended -->
  <g transform="translate(100,100)">
    <!-- Upper arm -->
    <rect x="-16" y="-60" width="32" height="70" rx="16" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Elbow crease -->
    <path d="M-12,5 Q0,10 12,5" fill="none" stroke="#D4745E" stroke-width="1" opacity="0.4"/>
    <!-- Forearm -->
    <rect x="-14" y="5" width="28" height="60" rx="14" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Sleeve at top -->
    <rect x="-20" y="-65" width="40" height="20" rx="5" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-20" y="-50" width="40" height="10" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-6" cy="-45" r="2.5" fill="#3D4852"/>
    <circle cx="6" cy="-45" r="2.5" fill="#3D4852"/>
    <!-- Hand at bottom -->
    <ellipse cx="0" cy="68" rx="14" ry="10" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
  </g>
</svg>