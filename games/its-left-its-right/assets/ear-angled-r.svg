    <ellipse cx="15" cy="0" rx="35" ry="50" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" opacity="0.3"/>
    <!-- Ear slightly turned -->
    <path d="M-10,-30 Q-30,-25 -35,-5 Q-37,12 -30,25 Q-22,35 -10,37 Q0,38 5,30 Q8,20 3,12 Q-2,8 -5,0 Q-7,-10 -3,-20 Q2,-28 -10,-30Z" fill="#F5B7B1" stroke="#E8967A" stroke-width="2"/>
    <!-- Inner detail -->
    <path d="M-5,-20 Q-20,-15 -23,0 Q-25,12 -18,22" fill="none" stroke="#D4745E" stroke-width="1.5"/>
    <ellipse cx="-8" cy="10" rx="5" ry="8" fill="#E8967A" stroke="#D4745E" stroke-width="1" opacity="0.5"/>
    <!-- Lobe -->
