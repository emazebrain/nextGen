<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right hand wave -->
  <g transform="translate(100,115) rotate(-15)">
    <ellipse cx="0" cy="40" rx="28" ry="20" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-28" y="30" width="56" height="14" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-10" cy="37" r="3" fill="#3D4852"/>
    <circle cx="10" cy="37" r="3" fill="#3D4852"/>
    <ellipse cx="0" cy="8" rx="25" ry="23" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Five spread fingers -->
    <rect x="-24" y="-28" width="10" height="36" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(-20,-19,-10)"/>
    <rect x="-12" y="-40" width="10" height="46" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(-8,-7,-17)"/>
    <rect x="-5" y="-44" width="10" height="48" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <rect x="2" y="-40" width="10" height="46" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(8,7,-17)"/>
    <rect x="14" y="-28" width="10" height="36" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(20,19,-10)"/>
    <!-- Thumb -->
    <rect x="-34" y="-2" width="12" height="28" rx="6" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(35,-28,12)"/>
  </g>
</svg>