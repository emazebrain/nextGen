<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right hand open palm -->
  <g transform="translate(100,115)">
    <ellipse cx="0" cy="40" rx="28" ry="20" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-28" y="30" width="56" height="14" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-10" cy="37" r="3" fill="#3D4852"/>
    <circle cx="10" cy="37" r="3" fill="#3D4852"/>
    <ellipse cx="0" cy="8" rx="26" ry="24" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Five fingers -->
    <rect x="-22" y="-30" width="10" height="38" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(-15,-17,-10)"/>
    <rect x="-12" y="-42" width="10" height="48" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(-5,-7,-18)"/>
    <rect x="-5" y="-45" width="10" height="50" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <rect x="2" y="-42" width="10" height="48" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(5,7,-18)"/>
    <rect x="12" y="-30" width="10" height="38" rx="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(15,17,-10)"/>
    <!-- Thumb -->
    <rect x="-32" y="-5" width="12" height="30" rx="6" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" transform="rotate(30,-26,10)"/>
  </g>
</svg>