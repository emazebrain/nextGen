<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right hand fist -->
  <g transform="translate(100,105)">
    <ellipse cx="0" cy="38" rx="28" ry="22" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-28" y="28" width="56" height="14" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-10" cy="35" r="3" fill="#3D4852"/>
    <circle cx="10" cy="35" r="3" fill="#3D4852"/>
    <!-- Fist shape -->
    <ellipse cx="0" cy="0" rx="26" ry="24" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Knuckle lines -->
    <path d="M-16,-8 Q-14,-14 -8,-12" fill="none" stroke="#D4745E" stroke-width="1.5" opacity="0.5"/>
    <path d="M-6,-10 Q-4,-16 2,-14" fill="none" stroke="#D4745E" stroke-width="1.5" opacity="0.5"/>
    <path d="M4,-10 Q6,-16 12,-14" fill="none" stroke="#D4745E" stroke-width="1.5" opacity="0.5"/>
    <!-- Thumb across front -->
    <ellipse cx="-8" cy="10" rx="18" ry="8" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5" transform="rotate(-10)"/>
  </g>
</svg>