<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right ear from behind -->
  <g transform="translate(100,100)">
    <!-- Back of head -->
    <ellipse cx="-10" cy="0" rx="40" ry="55" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" opacity="0.3"/>
    <!-- Ear from behind — shows back surface -->
    <path d="M10,-30 Q35,-25 38,-5 Q40,15 35,28 Q28,38 15,40 Q5,40 2,32 Q0,22 5,12 Q10,5 12,-5 Q14,-15 10,-25 Q8,-30 10,-30Z" fill="#F5B7B1" stroke="#E8967A" stroke-width="2"/>
    <!-- Back crease of ear -->
    <path d="M15,-20 Q28,-15 30,0 Q32,15 25,25" fill="none" stroke="#D4745E" stroke-width="1.5"/>
    <!-- Where ear meets head -->
    <path d="M8,-25 Q5,-10 5,5 Q5,20 8,32" fill="none" stroke="#D4745E" stroke-width="1.5" opacity="0.5"/>
    <!-- Lobe -->
    <ellipse cx="10" cy="37" rx="7" ry="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
  </g>
</svg>