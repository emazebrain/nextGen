<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right arm reaching up -->
  <g transform="translate(100,130)">
    <!-- Upper arm angled up -->
    <rect x="-16" y="-80" width="32" height="55" rx="16" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5" transform="rotate(15,0,-52)"/>
    <!-- Sleeve -->
    <rect x="-20" y="10" width="40" height="22" rx="5" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-20" y="5" width="40" height="10" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-6" cy="10" r="2.5" fill="#3D4852"/>
    <circle cx="6" cy="10" r="2.5" fill="#3D4852"/>
    <!-- Forearm -->
    <rect x="-14" y="-50" width="28" height="55" rx="14" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Hand reaching up -->
    <ellipse cx="4" cy="-80" rx="13" ry="10" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Fingers -->
    <rect x="-2" y="-92" width="8" height="14" rx="4" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <rect x="6" y="-90" width="8" height="12" rx="4" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
  </g>
</svg>