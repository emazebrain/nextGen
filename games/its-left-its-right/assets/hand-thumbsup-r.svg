<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right hand thumbs up -->
  <g transform="translate(100,100)">
    <!-- Sleeve -->
    <ellipse cx="0" cy="40" rx="30" ry="25" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-30" y="30" width="60" height="15" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-12" cy="37" r="3" fill="#3D4852"/>
    <circle cx="12" cy="37" r="3" fill="#3D4852"/>
    <!-- Palm -->
    <ellipse cx="0" cy="10" rx="25" ry="22" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Fingers curled -->
    <rect x="-18" y="-2" width="36" height="12" rx="8" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <!-- Thumb up -->
    <rect x="-8" y="-50" width="16" height="50" rx="8" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <ellipse cx="0" cy="-50" rx="8" ry="6" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <ellipse cx="0" cy="-48" rx="5" ry="3" fill="#F0D0C8"/>
  </g>
</svg>