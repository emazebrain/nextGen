<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right hand pinch -->
  <g transform="translate(100,108)">
    <ellipse cx="0" cy="38" rx="28" ry="20" fill="#7B8794" stroke="#5E6B77" stroke-width="1.5"/>
    <rect x="-28" y="28" width="56" height="14" rx="3" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
    <circle cx="-10" cy="35" r="3" fill="#3D4852"/>
    <circle cx="10" cy="35" r="3" fill="#3D4852"/>
    <ellipse cx="0" cy="8" rx="24" ry="20" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Three fingers curled -->
    <path d="M-5,-5 Q-15,-15 -18,-5 Q-18,2 -10,5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <path d="M5,-5 Q15,-15 18,-5 Q18,2 10,5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <!-- Thumb and index pinching -->
    <path d="M-10,-8 Q-15,-30 -5,-40 Q0,-42 2,-38" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <path d="M10,-8 Q18,-25 8,-38 Q5,-42 2,-38" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <circle cx="0" cy="-38" r="5" fill="#E8967A"/>
  </g>
</svg>