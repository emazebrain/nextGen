<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Right foot side view -->
  <g transform="translate(100,105)">
    <!-- Leg/ankle -->
    <rect x="-14" y="-50" width="28" height="50" rx="14" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Foot body -->
    <path d="M-14,0 Q-14,30 -30,35 Q-40,38 -40,30 Q-38,20 0,20 Q30,20 45,10 Q50,5 45,0 Q30,-5 0,-5 Z" fill="#F5B7B1" stroke="#E8967A" stroke-width="1.5"/>
    <!-- Toe bumps -->
    <ellipse cx="-35" cy="30" rx="6" ry="5" fill="#F5B7B1" stroke="#E8967A" stroke-width="1"/>
    <!-- Heel -->
    <ellipse cx="30" cy="10" rx="16" ry="14" fill="#F5B7B1" stroke="#E8967A" stroke-width="0.5" opacity="0.3"/>
    <!-- Ankle bone -->
    <circle cx="8" cy="-5" r="6" fill="#F5B7B1" stroke="#E8967A" stroke-width="1" opacity="0.5"/>
  </g>
</svg>